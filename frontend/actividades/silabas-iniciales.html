<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Formo sílabas | Software Educativo</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/tema.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/kids.css"><script src="/tema.js"></script>
</head>
<body class="game-page page-syllables-initial"><main class="wrap">
  <header class="hero hero-activity"><div class="hero-copy"><p class="hero-eyebrow">✦ MI RINCÓN DE LECTURA · NIVEL 2</p><h1>Formo sílabas</h1><p class="hero-description">Junta una consonante con una vocal y descubre cómo suenan: PA, PE, PI, PO, PU.</p></div><span class="hero-illustration" aria-hidden="true">🔡</span></header>
  <p><a class="back-link" href="/" data-back-to-activities>← Volver a mis actividades</a></p>
  <section class="panel learning-panel">
    <p id="status" class="status" role="status">Preparando actividad…</p>
    <div id="game" class="hidden">
      <p id="progress"></p><div class="progress-track" aria-label="Progreso"><div id="progressBar" class="progress-bar"></div></div>
      <p id="familyPrompt"></p>
      <div class="syllable-equation" aria-label="Consonante más vocal">
        <span id="consonant"></span><span aria-hidden="true">+</span><span id="vowel"></span><span aria-hidden="true">= ?</span>
      </div>
      <p>¿Qué sílaba se forma? Elige y léela en voz alta.</p>
      <button id="listen" type="button">🔊 Repetir sílaba</button>
      <div id="choices" class="choice-list"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
    </div>
    <div id="finished" class="hidden"><h2>¡Terminaste el Nivel 2!</h2><p id="result"></p><button id="retrySave" class="hidden" type="button">Intentar guardar de nuevo</button><a class="button-link" href="/" data-back-to-activities>Volver a mis actividades</a></div>
  </section>
</main>
<script src="/actividades/actividad.js"></script><script src="/actividades/silabas-iniciales.js"></script><script src="/kids.js"></script></body></html>
