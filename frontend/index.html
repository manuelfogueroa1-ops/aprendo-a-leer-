<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Software Educativo | Inicio</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="wrap"><header><h1>Software Educativo</h1><p>Actividades y seguimiento de aprendizaje</p></header>
<nav><button class="tab active" data-panel="estudiante">Estudiantes</button><button class="tab" data-panel="profesor">Acceso profesor</button></nav>
<section id="estudiante" class="panel"><div id="studentEntry"><h2>Elige tu nombre</h2><p id="studentStatus" class="status" role="status">Los estudiantes aparecen cuando la profesora los guarda.</p><div id="studentCards" class="student-cards"></div></div><div id="studentActivities" class="hidden"><div class="activities-heading"><div><h2>Mis actividades</h2><p id="studentWelcome" class="status"></p></div><button id="changeStudent" class="secondary-button" type="button">Cambiar estudiante</button></div><div id="activities"></div></div></section>
<section id="profesor" class="panel hidden"><h2>Panel privado del profesor</h2><form id="teacherForm"><label>Usuario<input name="usuario" autocomplete="username" required></label><label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label><button>Iniciar sesión</button></form><p id="teacherStatus" class="status"></p><div id="report" class="hidden"><section class="student-management"><h3>Estudiantes</h3><form id="studentForm"><label>Nombre<input name="nombre" maxlength="80" required></label><label>Apellido<input name="apellido" maxlength="80" required></label><button>Guardar estudiante</button></form><p id="studentManagementStatus" class="status" role="status"></p><div id="teacherStudentCards" class="student-cards"></div></section><form id="filterForm" class="filters"><label>Nombre (opcional)<input name="nombre"></label><label>Apellido (opcional)<input name="apellido"></label><button>Buscar resultados</button><button type="button" id="logout">Cerrar sesión</button></form><div id="results"></div></div></section>
<footer>Aplicación para red local · Acceso de profesor protegido por sesión</footer></main><script src="/app.js"></script></body></html>
